# Symlink manifest: <source in repo>  <target on disk>
#
# Blank lines and lines starting with # are ignored.
# The target's leading ~ expands to $HOME.
#
# A source may appear more than once with different targets. That is how
# AGENTS.md is shared between Claude and Codex from a single file.

# ---- shell ----
home/.zshrc                             ~/.zshrc
home/.zprofile                          ~/.zprofile

# ---- prompt & terminal ----
home/.config/starship                   ~/.config/starship
home/.config/wezterm                    ~/.config/wezterm

# ---- editor ----
home/.config/nvim                       ~/.config/nvim

# ---- herdr (file only: dir holds sockets, logs, session state) ----
home/.config/herdr/config.toml          ~/.config/herdr/config.toml

# ---- claude (files only: dir holds history, sessions, caches) ----
home/.claude/settings.json              ~/.claude/settings.json
home/.claude/statusline-command.sh      ~/.claude/statusline-command.sh
home/.claude/agents/frontend-dev.md     ~/.claude/agents/frontend-dev.md

# ---- shared AI memory: one file, two homes ----
home/AGENTS.md                          ~/.claude/CLAUDE.md
home/AGENTS.md                          ~/.codex/AGENTS.md
